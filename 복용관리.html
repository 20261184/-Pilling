<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilling</title>
<style>
  :root{
    --green-dark:#1f6b3a;
    --green-deep:#1a4d2c;
    --green-mid:#2f8f4e;
    --green-pale:#eaf3ea;
    --green-line:#dbe8db;
    --text-dark:#1c2b22;
    --text-mid:#5b6b60;
    --text-light:#9aa79e;
    --cream:#f7f8f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eef7ec,#ffffff 30%);
    color:var(--text-dark);
  }
  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:60px 48px 90px;
    position:relative;
  }

  .top-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom:36px;
  }
  .logo-mark{
    font-size:24px;
    font-weight:800;
    color:#1a3f26;
    letter-spacing:-0.02em;
    justify-self:start;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#1a3f26;
    font-weight:800;
    font-size:19px;
    justify-self:center;
  }
  .pill-tag{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    border:1px solid var(--green-line);
    border-radius:30px;
    padding:9px 18px;
    font-size:13.5px;
    font-weight:700;
    color:#1a3f26;
    box-shadow:0 6px 16px -10px rgba(31,107,58,0.3);
    justify-self:end;
  }

  .heading{margin-bottom:44px;}
  .heading-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:14px 0 18px;
  }
  .heading-icon{
    width:44px;height:44px;
    border-radius:14px;
    background:var(--green-pale);
    color:#1a3f26;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .heading h1{
    font-size:42px;
    font-weight:800;
    line-height:1.32;
    margin:0;
    color:black;
    letter-spacing:-0.01em;
  }
  .heading p{
    font-size:16px;
    color:var(--text-mid);
    margin:0;
  }

  .main-grid{
    display:flex;
    gap:32px;
    align-items:flex-start;
  }

  .checklist-card{
    flex:0 0 420px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    border:1px solid #eef2ec;
    box-shadow:0 24px 50px -28px rgba(31,107,58,0.2);
  }
  .checklist-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:17px;
    font-weight:800;
    margin-bottom:18px;
  }
  .checklist-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid #eef2ec;
  }
  .checklist-meta .date{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14.5px;
    font-weight:600;
    color:var(--text-mid);
  }
  .checklist-meta .progress{
    font-size:14.5px;
    font-weight:700;
    color:#1a3f26;
  }

  .med-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--cream);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    transition:background .15s;
  }
  .med-left{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .med-check{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid #cfdccd;
    background:#fff;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    cursor:pointer;
    transition:all .15s;
  }
  .med-check.checked{
    background:var(--green-deep);
    border-color:var(--green-deep);
  }
  .med-name{font-size:15px; font-weight:700;}
  .med-sub{font-size:12.5px; color:var(--text-light); margin-top:2px;}
  .med-btn{
    background:var(--green-pale);
    color:#1a3f26;
    border:none;
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .med-btn.done{
    background:#fff;
    color:var(--text-light);
  }
  .med-btn:hover{background:#d9ecd6;}

  .add-btn{
    width:100%;
    margin-top:6px;
    background:transparent;
    border:1.5px dashed var(--green-line);
    border-radius:14px;
    padding:14px;
    font-size:14.5px;
    font-weight:700;
    color:#1a3f26;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .add-btn:hover{background:var(--green-pale); border-color:var(--green-mid);}

  .calendar-card{
    flex:1;
    background:#fff;
    border-radius:22px;
    padding:34px 36px;
    border:1px solid #eef2ec;
    box-shadow:0 24px 50px -28px rgba(31,107,58,0.2);
  }
  .cal-mini-stats{
    display:flex;
    align-items:center;
    margin-bottom:24px;
    padding-bottom:22px;
    border-bottom:1px solid #eef2ec;
  }
  .mini-stat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:left;
  }
  .mini-stat-icon{
    width:40px;height:40px;
    border-radius:12px;
    background:var(--green-pale);
    color:#1a3f26;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .mini-stat-label{font-size:12.5px; color:var(--text-mid); font-weight:600; margin-bottom:2px;}
  .mini-stat-value{font-size:22px; font-weight:800; color:#1a3f26;}
  .mini-stat-value.small{font-size:14.5px; font-weight:700; line-height:1.35;}
  .mini-divider{width:1px; height:34px; background:#e7ede6; flex-shrink:0;}

  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .cal-head h2{
    font-size:26px;
    font-weight:800;
    color:#1a3f26;
    margin:0;
  }
  .cal-nav{display:flex; gap:10px;}
  .cal-nav button{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid #e2e9e3;
    background:#fff;
    color:var(--text-mid);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .cal-nav button:hover{background:var(--green-pale); border-color:var(--green-mid); color:#1a3f26;}

  table{width:100%; border-collapse:collapse;}
  th{
    font-size:14px;
    font-weight:700;
    color:var(--text-mid);
    padding:8px 0 18px;
  }
  td{
    text-align:center;
    padding:10px 4px;
    vertical-align:top;
  }
  .day-num{
    font-size:16px;
    font-weight:600;
    color:var(--text-dark);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:36px;height:36px;
    border-radius:50%;
  }
  .day-num.muted{color:#c7d2c5;}
  .day-num.today{
    background:var(--green-deep);
    color:#fff;
  }
  .day-check{
    margin-top:5px;
    display:flex;
    justify-content:center;
  }

  @media (max-width:1000px){
    .wrap{padding:40px 20px 60px;}
    .top-row{grid-template-columns:auto 1fr auto; gap:12px;}
    .main-grid{flex-direction:column;}
    .checklist-card{flex:1; width:100%;}
    .heading h1{font-size:30px;}
    .heading-row{flex-wrap:wrap;}
    .cal-mini-stats{flex-wrap:wrap; gap:16px;}
    .mini-divider{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <div class="logo-mark">Pilling</div>
    <div class="eyebrow">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5c0 1.43.74 2.84 1.5 3.5C2.74 12.41 6.97 9.13 17 8z"/></svg>
      복용 관리
    </div>
    <div class="pill-tag">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5c0 1.43.74 2.84 1.5 3.5C2.74 12.41 6.97 9.13 17 8z"/></svg>
      오늘도 파이팅!
    </div>
  </div>

  <div class="heading">
    <div class="heading-row">
      <h1>오늘도 건강한 습관을 기록해보세요!</h1>
    </div>
    <p>매일의 작은 실천이 큰 변화를 만듭니다.</p>
  </div>

  <div class="main-grid">

    <div class="checklist-card">
      <div class="checklist-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9z"/><polyline points="9 12 11 14 15 10"/></svg>
        오늘의 복용 체크
      </div>

      <div class="checklist-meta">
        <span class="date" id="todayLabel"></span>
        <span class="progress" id="progressLabel"></span>
      </div>

      <div id="medList"></div>

      <button class="add-btn" id="addMedBtn">+ 새 약 추가하기</button>
    </div>

    <div class="calendar-card">
      <div class="cal-mini-stats">
        <div class="mini-stat">
          <span class="mini-stat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><polyline points="9 12 11 14 15 10"/></svg>
          </span>
          <div>
            <div class="mini-stat-label">복용 완료율</div>
            <div class="mini-stat-value" id="completionRate">0%</div>
          </div>
        </div>

        <div class="mini-divider"></div>

        <div class="mini-stat">
          <span class="mini-stat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <div>
            <div class="mini-stat-label">연속 복용 일수</div>
            <div class="mini-stat-value" id="streakDays">0일</div>
          </div>
        </div>
      </div>

      <div class="cal-head">
        <h2 id="calTitle"></h2>
        <div class="cal-nav">
          <button id="prevMonth">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button id="nextMonth">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
          </tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const todayKey = (d) => {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };

  const meds = [
    { id:'tylenol', name:'타이레놀 500mg · 1정', sub:'오전 08:00 · 식후 30분' },
    { id:'vitc',     name:'비타민 C 1000mg · 1정', sub:'오후 01:00 · 식후 무관' },
    { id:'omega3',   name:'오메가3 · 1캡슐', sub:'오후 09:00 · 식후 30분' }
  ];

  const real = new Date();
  const checkLog = {};
  checkLog[todayKey(real)] = {};

  let viewYear = real.getFullYear();
  let viewMonth = real.getMonth();

  const weekdayNames = ['일','월','화','수','목','금','토'];
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  function isAllChecked(dateKey){
    const log = checkLog[dateKey];
    if(!log) return false;
    return meds.every(m => log[m.id]);
  }

  function renderMedList(){
    const list = document.getElementById('medList');
    list.innerHTML = '';
    const key = todayKey(real);
    const log = checkLog[key] || (checkLog[key] = {});
    let doneCount = 0;

    meds.forEach(med => {
      const checked = !!log[med.id];
      if(checked) doneCount++;

      const row = document.createElement('div');
      row.className = 'med-item';
      row.innerHTML = `
        <div class="med-left">
          <span class="med-check ${checked ? 'checked' : ''}" data-id="${med.id}">
            ${checked ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </span>
          <div>
            <div class="med-name">${med.name}</div>
            <div class="med-sub">${med.sub}</div>
          </div>
        </div>
        <button class="med-btn ${checked ? 'done' : ''}" data-id="${med.id}">${checked ? '복용 완료' : '복용하기'}</button>
      `;
      list.appendChild(row);
    });

    document.getElementById('progressLabel').textContent = `${doneCount}/${meds.length} 완료`;

    const dateObj = real;
    const dateStr = `${dateObj.getFullYear()}년 ${dateObj.getMonth()+1}월 ${dateObj.getDate()}일 ${weekdayNames[dateObj.getDay()]}요일`;
    document.getElementById('todayLabel').innerHTML =
      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${dateStr}`;

    list.querySelectorAll('.med-check, .med-btn').forEach(el => {
      el.addEventListener('click', () => toggleMed(el.dataset.id));
    });

    updateStats();
    renderCalendar();
  }

  function toggleMed(id){
    const key = todayKey(real);
    const log = checkLog[key] || (checkLog[key] = {});
    log[id] = !log[id];
    renderMedList();
  }

  function updateStats(){
    const key = todayKey(real);
    const log = checkLog[key] || {};
    const total = meds.length;
    const done = meds.filter(m => log[m.id]).length;
    const rate = total ? Math.round((done/total)*100) : 0;
    document.getElementById('completionRate').textContent = `${rate}%`;

    let streak = 0;
    let cursor = new Date(real);
    while(true){
      const k = todayKey(cursor);
      if(isAllChecked(k)){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else {
        break;
      }
    }
    document.getElementById('streakDays').textContent = `${streak}일`;
  }

  function renderCalendar(){
    document.getElementById('calTitle').textContent = `${viewYear}년 ${monthNames[viewMonth]}`;

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const cells = [];
    for(let i=0; i<startWeekday; i++){
      cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, muted:true });
    }
    for(let d=1; d<=daysInMonth; d++){
      cells.push({ day:d, muted:false, dateObj:new Date(viewYear, viewMonth, d) });
    }
    while(cells.length % 7 !== 0){
      cells.push({ day: cells.length - (startWeekday + daysInMonth) + 1, muted:true });
    }

    const tbody = document.getElementById('calBody');
    tbody.innerHTML = '';
    for(let r=0; r<cells.length/7; r++){
      const tr = document.createElement('tr');
      for(let c=0; c<7; c++){
        const cell = cells[r*7+c];
        const td = document.createElement('td');
        if(cell.muted){
          td.innerHTML = `<span class="day-num muted">${cell.day}</span>`;
        } else {
          const isToday = todayKey(cell.dateObj) === todayKey(real);
          const checked = isAllChecked(todayKey(cell.dateObj));
          td.innerHTML = `
            <span class="day-num ${isToday ? 'today' : ''}">${cell.day}</span>
            <div class="day-check">${checked ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#e3f3e6"/><path d="M9 12l2 2 4-4" stroke="#2f8f4e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>
          `;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });
  document.getElementById('addMedBtn').addEventListener('click', () => {
    const name = prompt('추가할 약 이름과 용량을 입력하세요 (예: 마그네슘 200mg · 1정)');
    if(!name) return;
    const time = prompt('복용 시간을 입력하세요 (예: 오후 07:00 · 식후 30분)') || '';
    meds.push({ id: 'med_' + Date.now(), name, sub: time });
    renderMedList();
  });

  renderMedList();
</script>
</body>
</html>
