<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Pilling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #eaf0ed ; /* 첨부 이미지 배경색에 맞춰 수정 */
      font-family: 'Arial', sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      padding: 20px;
    }
    header h1 {
      font-size: 80px;
      color: rgb(174, 231, 89); /* 슬라이드에 표시된 글자색으로 맞춰주세요 */
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      margin: 0;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh; /* 화면 중앙에 크게 배치 */
    }
    .logo-container img {
      max-width: 600px; /* 로고 크기 크게 */
      height: auto;
    }
  </style>
</head>
<body>

<header>
  <h1>나만의 디지털 약국</h1>
</header>

<div class="logo-container">
  <img src="로고.jpg" alt="Pilling 로고">
</div>

</body>
</html>
